# Service name and port
spring.application.name=ArtworkPostServices
server.port=8082

# Eureka connection
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Database URL
spring.datasource.url=jdbc:sqlserver://DESKTOP-9RSJN03\\SQLEXPRESS;databaseName=Microservices_ArtAuction;\
  integratedSecurity=true;encrypt=true;trustServerCertificate=true

# Driver Class
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate / JPA Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# JWT Configurations (must match Authentication Service exactly)
jwt.secret-key=ArtAuction-Super-Secret-Key-Min-32-Chars!!
jwt.issuer=ArtAuction
jwt.audience=ArtAuctionClients
jwt.expiry-hours=1

# Kafka connection and topics size
spring.cloud.stream.kafka.binder.brokers=localhost:9092
spring.cloud.stream.kafka.binder.configuration.max.request.size=20971520
spring.cloud.stream.kafka.binder.configuration.max.partition.fetch.bytes=20971520

# AuctionServices input reply
spring.cloud.stream.bindings.checkPostRequest-in-0.destination=auction.check.post.request
spring.cloud.stream.bindings.checkPostRequest-in-0.group=artworkpost-service
spring.cloud.stream.bindings.postDataRequest-in-0.destination=auction.post.data.request
spring.cloud.stream.bindings.postDataRequest-in-0.group=artworkpost-service
spring.cloud.stream.bindings.endedPostsRequest-in-0.destination=auction.ended.posts.request
spring.cloud.stream.bindings.endedPostsRequest-in-0.group=artworkpost-service
spring.cloud.stream.bindings.updateBuyNowPriceRequest-in-0.destination=auction.update.buynowprice.request
spring.cloud.stream.bindings.updateBuyNowPriceRequest-in-0.group=artworkpost-service
spring.cloud.stream.bindings.endedPostDataRequest-in-0.destination=auction.ended.post.data.request
spring.cloud.stream.bindings.endedPostDataRequest-in-0.group=artworkpost-service

# AuctionServices output reply
spring.cloud.stream.bindings.checkPostRequest-out-0.destination=auction.check.post.reply
spring.cloud.stream.bindings.postDataRequest-out-0.destination=auction.post.data.reply
spring.cloud.stream.bindings.endedPostsRequest-out-0.destination=auction.ended.posts.reply
spring.cloud.stream.bindings.updateBuyNowPriceRequest-out-0.destination=auction.update.buynowprice.reply
spring.cloud.stream.bindings.endedPostDataRequest-out-0.destination=auction.ended.post.data.reply

# Kafka serialization
spring.cloud.stream.kafka.bindings.checkAdminRequest-out-0.producer.configuration.key.serializer=org.apache.kafka.common.serialization.StringSerializer
spring.cloud.stream.kafka.bindings.checkAdminReply-in-0.consumer.configuration.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.cloud.stream.kafka.bindings.checkBuyerRequest-out-0.producer.configuration.key.serializer=org.apache.kafka.common.serialization.StringSerializer
spring.cloud.stream.kafka.bindings.checkBuyerReply-in-0.consumer.configuration.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.cloud.stream.kafka.bindings.checkArtistRequest-out-0.producer.configuration.key.serializer=org.apache.kafka.common.serialization.StringSerializer
spring.cloud.stream.kafka.bindings.checkArtistReply-in-0.consumer.configuration.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.cloud.stream.kafka.bindings.artistDataRequest-out-0.producer.configuration.key.serializer=org.apache.kafka.common.serialization.StringSerializer
spring.cloud.stream.kafka.bindings.artistDataReply-in-0.consumer.configuration.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.cloud.stream.kafka.bindings.bidsDataRequest-out-0.producer.configuration.key.serializer=org.apache.kafka.common.serialization.StringSerializer
spring.cloud.stream.kafka.bindings.bidsDataReply-in-0.consumer.configuration.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Kafka Bindings
spring.cloud.stream.bindings.checkAdminRequest-out-0.destination=artworkpost.check.admin.request
spring.cloud.stream.bindings.checkAdminReply-in-0.destination=artworkpost.check.admin.reply
spring.cloud.stream.bindings.checkAdminReply-in-0.group=artworkpost-service

spring.cloud.stream.bindings.checkBuyerRequest-out-0.destination=artworkpost.check.buyer.request
spring.cloud.stream.bindings.checkBuyerReply-in-0.destination=artworkpost.check.buyer.reply
spring.cloud.stream.bindings.checkBuyerReply-in-0.group=artworkpost-service

spring.cloud.stream.bindings.checkArtistRequest-out-0.destination=artworkpost.check.artist.request
spring.cloud.stream.bindings.checkArtistReply-in-0.destination=artworkpost.check.artist.reply
spring.cloud.stream.bindings.checkArtistReply-in-0.group=artworkpost-service

spring.cloud.stream.bindings.artistDataRequest-out-0.destination=artworkpost.artist.data.request
spring.cloud.stream.bindings.artistDataReply-in-0.destination=artworkpost.artist.data.reply
spring.cloud.stream.bindings.artistDataReply-in-0.group=artworkpost-service

spring.cloud.stream.bindings.bidsDataRequest-out-0.destination=artworkpost.bids.data.request
spring.cloud.stream.bindings.bidsDataReply-in-0.destination=artworkpost.bids.data.reply
spring.cloud.stream.bindings.bidsDataReply-in-0.group=artworkpost-service

# Binding Kafka methods
spring.cloud.function.definition=checkPostRequest;postDataRequest;endedPostsRequest;updateBuyNowPriceRequest;\
  endedPostDataRequest;checkAdminReply;checkBuyerReply;checkArtistReply;artistDataReply;bidsDataReply