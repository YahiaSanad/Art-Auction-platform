# Service name and port
spring.application.name=ApiGateway
server.port=8000
spring.cloud.config.server.git.uri=https://github.com/Davidemad24/ArtAuction

# Register ArtistServices
spring.cloud.gateway.routes[0].id=artist
spring.cloud.gateway.routes[0].uri=lb://ArtistServices
spring.cloud.gateway.routes[0].predicates[0]=Path=/Artist/**

# Register ArtworkPostServices
spring.cloud.gateway.routes[1].id=artworkPost
spring.cloud.gateway.routes[1].uri=lb://ArtworkPostServices
spring.cloud.gateway.routes[1].predicates[0]=Path=/ArtworkPost/**, /Category/**, /Tag/**, /WatchList/**

# Register AuctionServices
spring.cloud.gateway.routes[2].id=auction
spring.cloud.gateway.routes[2].uri=lb://AuctionServices
spring.cloud.gateway.routes[2].predicates[0]=Path=/PostBid/**, /PostSold/**

# Register AuthenticationServices
spring.cloud.gateway.routes[3].id=authentication
spring.cloud.gateway.routes[3].uri=lb://AuthenticationServices
spring.cloud.gateway.routes[3].predicates[0]=Path=/Authentication/**

# Global CORS (Allow frontend to send requests)
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOriginPatterns=http://localhost:*,http://127.0.0.1:*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].maxAge=3600

# Request body limits (forwarding multipart uploads through gateway)
spring.codec.max-in-memory-size=30MB
spring.webflux.multipart.max-in-memory-size=30MB
spring.webflux.multipart.max-disk-usage-per-part=50MB
spring.webflux.multipart.max-parts=20

# Eureka configurations
eureka.client.service-url.defaultZone=http://localhost:8761/eureka